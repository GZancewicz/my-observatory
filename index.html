<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Observatory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/charts.css">
  <link rel="stylesheet" href="assets/sizes.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">My Observatory</a>
    <a id="overview-link" class="navlink" href="#overview">Overview</a>
    <a id="sizes-link" class="navlink" href="#sizes">Sizes</a>
    <a id="objects-link" class="navlink" href="#objects">Objects</a>
    <input id="search" type="search" placeholder="Search objects, designations, constellations…" autocomplete="off">
    <select id="sort" aria-label="Sort">
      <option value="last">Last observed</option>
      <option value="name">Name</option>
      <option value="mag">Brightest first</option>
      <option value="dist">Nearest first</option>
      <option value="rating">Best rated</option>
      <option value="count">Most observed</option>
    </select>
    <button id="glossary-btn" class="ghost" title="Glossary: what the terms on these pages mean" aria-label="Glossary" aria-haspopup="dialog">?</button>
    <button id="night" class="ghost" title="Red night-vision mode">Night</button>
  </header>
  <nav id="chips" class="chips" aria-label="Categories"></nav>
  <main class="layout">
    <aside id="list" class="list" aria-label="Objects"></aside>
    <section id="detail" class="detail" aria-live="polite"></section>
  </main>
  <!-- order matters: data and charts must exist before app.js boots -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js" charset="utf-8"></script>
  <script src="data/bundle.js"></script>
  <script src="data/targets.js"></script>
  <script src="data/sky/boundaries.js"></script>
  <script src="assets/glossary.js"></script>
  <script src="assets/charts.js"></script>
  <script src="assets/sizes.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
